<style>
 text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Consolas,'Liberation Mono',monospace}
 .float{animation:float 6s ease-in-out infinite}.float2{animation:float 7s ease-in-out -2s infinite}
 .orbit{transform-origin:979px 291px;animation:orbit 45s linear infinite}
 .signal{animation:signal 4s ease-in-out infinite}.beam{animation:beam 5s linear infinite}
 .role1{animation:role1 12s infinite}.role2{opacity:0;animation:role2 12s infinite}.role3{opacity:0;animation:role3 12s infinite}
 @keyframes float{50%{transform:translateY(-14px)}}@keyframes orbit{to{transform:rotate(360deg)}}
 @keyframes signal{50%{opacity:.3}}@keyframes beam{to{stroke-dashoffset:-120}}
 @keyframes role1{0%,27%,100%{opacity:1}32%,95%{opacity:0}}
 @keyframes role2{0%,30%,65%,100%{opacity:0}35%,60%{opacity:1}}
 @keyframes role3{0%,63%,100%{opacity:0}68%,93%{opacity:1}}
 @media(prefers-reduced-motion:reduce){.float,.float2,.orbit,.signal,.beam,.role1,.role2,.role3{animation:none!important}.role1{opacity:1}.role2,.role3{opacity:0}}
</style>
